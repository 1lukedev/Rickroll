<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rickroll</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Video Player Wrapper */
    .video-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(100% - 48px); /* Leaves space for the fixed footer */
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* 24/7 Fixed Footer */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 48px;
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center; /* Centered now that the counter is gone */
      padding: 0 20px;
      z-index: 9999;
      font-size: 0.9rem;
    }

    .footer-content {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .footer-text {
      color: #cbd5e1;
    }

    .blog-btn {
      padding: 4px 12px;
      background-color: #38bdf8;
      color: #0f172a;
      text-decoration: none;
      font-weight: 700;
      border-radius: 4px;
      font-size: 0.8rem;
      transition: background-color 0.2s ease;
    }

    .blog-btn:hover {
      background-color: #7dd3fc;
    }

    @media (max-width: 600px) {
      footer {
        height: 60px;
        padding: 6px 10px;
        font-size: 0.78rem;
      }
      .footer-content {
        flex-direction: column;
        justify-content: center;
        gap: 4px;
      }
      .video-container {
        height: calc(100% - 60px);
      }
    }
  </style>
</head>
<body>

  <!-- Ad-Free Embed Player -->
  <div class="video-container">
    <iframe 
      src="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ?autoplay=1&mute=0&controls=1&rel=0&loop=1&playlist=dQw4w9WgXcQ" 
      title="Rickroll Video" 
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
      allowfullscreen>
    </iframe>
  </div>

  <!-- 24/7 Fixed Footer -->
  <footer>
    <div class="footer-content">
      <span class="footer-text">Developed and hosted by Luke, funded by The Net Worth Challenge</span>
      <a href="about.html" class="blog-btn">Blog</a>
    </div>
  </footer>

</body>
</html>
