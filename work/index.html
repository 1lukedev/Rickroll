<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iMedia Revision Kahoot</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: #46178f; /* Kahoot Purple */
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        #quiz-container {
            width: 90%;
            max-width: 800px;
            margin-top: 50px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            background: white;
            color: #333;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 0px #ccc;
        }

        .answers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .answer-btn {
            padding: 30px 20px;
            font-size: 1.5rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0px 4px 0px rgba(0,0,0,0.2);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .answer-btn:active {
            transform: translateY(4px);
            box-shadow: 0px 0px 0px rgba(0,0,0,0.2);
        }

        .color-red { background-color: #e21b3c; }
        .color-blue { background-color: #1368ce; }
        .color-yellow { background-color: #d89e00; }
        .color-green { background-color: #26890c; }

        #score-screen {
            display: none;
            margin-top: 100px;
        }

        .input-group {
            margin-top: 20px;
        }

        input[type="text"] {
            padding: 15px;
            font-size: 1.2rem;
            border-radius: 5px;
            border: none;
            outline: none;
            font-family: 'Montserrat', sans-serif;
        }

        button.save-btn {
            padding: 15px 30px;
            font-size: 1.2rem;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-weight: bold;
        }

        #leaderboard {
            margin-top: 30px;
            background: white;
            color: black;
            padding: 20px;
            border-radius: 10px;
            text-align: left;
        }
    </style>
</head>
<body>

    <div id="quiz-container">
        <h1 id="question-text">Loading Question...</h1>
        <div class="answers-grid" id="answers-box">
            <!-- Buttons injected here by JS -->
        </div>
    </div>

    <div id="score-screen">
        <h1>Quiz Complete!</h1>
        <h2 id="final-score">Your Score: 0</h2>
        <div class="input-group">
            <input type="text" id="player-name" placeholder="Enter your name">
            <button class="save-btn" onclick="saveScore()">Save to Leaderboard</button>
        </div>
        <div id="leaderboard">
            <h3>High Scores (Firebase Data)</h3>
            <ul id="score-list"></ul>
        </div>
    </div>

    <!-- Firebase SDK (Modular V13.0.0) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-analytics.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

        // Your exact Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBVmSUK1Ju_DFUPR-70CKYTpaQ-hRjpXJU",
            authDomain: "imedia-revision-quiz.firebaseapp.com",
            projectId: "imedia-revision-quiz",
            storageBucket: "imedia-revision-quiz.firebasestorage.app",
            messagingSenderId: "598215626263",
            appId: "1:598215626263:web:bec1944860957e6ab3d652",
            measurementId: "G-2X21TSZJ3X"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        // iMedia Quiz Data based on your revision site
        const questions = [
            {
                question: "Which organisation is responsible for classifying films in the UK?",
                answers: ["Ofcom", "PEGI", "BBFC", "ASA"],
                correct: 2 // Index of correct answer (BBFC)
            },
            {
                question: "Which document is best used to map out the scenes of a video product?",
                answers: ["Mood Board", "Mind Map", "Visualisation Diagram", "Storyboard"],
                correct: 3 
            },
            {
                question: "Which of these is a lossy image compression format?",
                answers: ["JPEG", "PNG", "TIFF", "BMP"],
                correct: 0 
            },
            {
                question: "What law protects the original work of creators from being copied?",
                answers: ["Data Protection Act", "Copyright, Designs and Patents Act", "Computer Misuse Act", "Freedom of Information Act"],
                correct: 1 
            },
            {
                question: "Which method is an example of primary research?",
                answers: ["Reading a book", "Using census data", "Conducting a questionnaire", "Looking at a website"],
                correct: 2 
            }
        ];

        const colors = ['color-red', 'color-blue', 'color-yellow', 'color-green'];
        let currentQuestion = 0;
        let score = 0;

        const questionText = document.getElementById('question-text');
        const answersBox = document.getElementById('answers-box');
        const quizContainer = document.getElementById('quiz-container');
        const scoreScreen = document.getElementById('score-screen');

        window.loadQuestion = function() {
            answersBox.innerHTML = '';
            let q = questions[currentQuestion];
            questionText.innerText = q.question;

            q.answers.forEach((ans, index) => {
                let btn = document.createElement('button');
                btn.className = `answer-btn ${colors[index]}`;
                btn.innerText = ans;
                btn.onclick = () => checkAnswer(index);
                answersBox.appendChild(btn);
            });
        }

        window.checkAnswer = function(selectedIndex) {
            if (selectedIndex === questions[currentQuestion].correct) {
                score += 1000; // Kahoot style scoring
            }
            
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                endQuiz();
            }
        }

        window.endQuiz = function() {
            quizContainer.style.display = 'none';
            scoreScreen.style.display = 'block';
            document.getElementById('final-score').innerText = `Your Score: ${score}`;
            loadLeaderboard();
        }

        window.saveScore = async function() {
            const name = document.getElementById('player-name').value;
            if(!name) return alert('Please enter a name, my friend!');

            try {
                await addDoc(collection(db, "imedia_scores"), {
                    name: name,
                    score: score,
                    timestamp: new Date()
                });
                alert('Score saved successfully! Excellent job!');
                document.getElementById('player-name').value = ''; // Clear input
                loadLeaderboard();
            } catch (e) {
                console.error("Error adding document: ", e);
                alert("Cannot save score. Did you remember to set up the Firestore Database and set it to Test Mode in the console, yaar?");
            }
        }

        window.loadLeaderboard = async function() {
            const list = document.getElementById('score-list');
            list.innerHTML = 'Loading...';
            
            try {
                const q = query(collection(db, "imedia_scores"), orderBy("score", "desc"), limit(5));
                const querySnapshot = await getDocs(q);
                list.innerHTML = '';
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    let li = document.createElement('li');
                    li.innerText = `${data.name} - ${data.score} points`;
                    list.appendChild(li);
                });
            } catch (e) {
                console.error("Error loading leaderboard: ", e);
                list.innerHTML = "Cannot load leaderboard. Make sure Firestore is set to Test Mode.";
            }
        }

        // Start the quiz
        loadQuestion();
    </script>
</body>
</html>
